<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dublandio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
  <script>try { const t = localStorage.getItem("dublandio-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='6' width='2' height='4' rx='1' fill='%230F6E6E'/><rect x='5' y='3' width='2' height='10' rx='1' fill='%230F6E6E'/><rect x='9' y='5' width='2' height='6' rx='1' fill='%23D7263D'/><rect x='13' y='7' width='2' height='2' rx='1' fill='%230F6E6E'/></svg>">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-anterior" viewBox="0 0 24 24"><path d="M5 5h3v14H5zM19 5 9 12l10 7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-proximo" viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM5 5l10 7-10 7z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="m16 2 4 4-4 4M20 6H7a4 4 0 0 0-4 4m5 12-4-4 4-4M4 18h13a4 4 0 0 0 4-4"/><path d="M12 10v4"/></symbol>
    <symbol id="i-fila-auto" viewBox="0 0 24 24"><path d="M3 5h18M3 10h10M3 15h6"/><path d="m15 13 7 4-7 4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-mudo" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4zM16 9l6 6M22 9l-6 6"/></symbol>
    <symbol id="i-livro" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
    <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-capitulos" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></symbol>
    <symbol id="i-vozes" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></symbol>
    <symbol id="i-videos" viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="m22 8-6 4 6 4z"/></symbol>
    <symbol id="i-catalogo" viewBox="0 0 24 24"><path d="M2 12h2M6 8v8M10 5v14M14 9v6M18 7v10M22 12h-2"/></symbol>
    <symbol id="i-config" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-chave" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m11.5 11.5 9-9M16 7l3 3M19 4l2 2"/></symbol>
    <symbol id="i-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-lua" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  </svg>
  <div class="app">
    <aside class="lateral">
      <div class="marca">
        <svg class="marca-icone" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1" y="6" width="2" height="4" rx="1"/><rect x="5" y="3" width="2" height="10" rx="1"/>
          <rect x="9" y="5" width="2" height="6" rx="1" class="rec"/><rect x="13" y="7" width="2" height="2" rx="1"/>
        </svg>
        dublandio
      </div>
      <nav class="lateral-livros" aria-labelledby="titulo-livros">
        <h2 id="titulo-livros" class="lateral-titulo">Livros</h2>
        <ul id="livros" class="livros"></ul>
        <a href="#/+novo" id="adicionar-livro" class="adicionar-livro">
          <svg class="icone" aria-hidden="true"><use href="#i-mais"/></svg> Adicionar livro
        </a>
      </nav>
      <div class="lateral-rodape">
        <section id="chaves" class="chaves" aria-label="Chaves dos provedores"></section>
        <div class="tema" role="radiogroup" aria-label="Tema da interface">
          <button type="button" role="radio" data-tema="light" aria-label="Tema claro" title="Claro"><svg class="icone" aria-hidden="true"><use href="#i-sol"/></svg></button>
          <button type="button" role="radio" data-tema="auto" aria-label="Tema do sistema" title="Automático"><svg class="icone" aria-hidden="true"><use href="#i-auto"/></svg></button>
          <button type="button" role="radio" data-tema="dark" aria-label="Tema escuro" title="Escuro"><svg class="icone" aria-hidden="true"><use href="#i-lua"/></svg></button>
        </div>
      </div>
    </aside>

    <main id="principal" class="principal">
      <div class="vazio">Carregando livros…</div>
    </main>
  </div>

  <section id="progresso" class="progresso" hidden aria-live="polite">
    <div class="progresso-topo">
      <span class="progresso-luz" aria-hidden="true"></span>
      <strong id="progresso-titulo"></strong>
      <span id="progresso-contagem" class="progresso-contagem"></span>
      <button id="progresso-fechar" class="botao-icone" type="button" aria-label="Fechar painel" hidden>×</button>
    </div>
    <div class="barra"><div id="progresso-barra" class="barra-cheia"></div></div>
    <ol id="progresso-log" class="progresso-log"></ol>
  </section>

  <dialog id="dialogo" class="dialogo">
    <form method="dialog">
      <h2 id="dialogo-titulo"></h2>
      <div id="dialogo-texto" class="dialogo-texto"></div>
      <div class="dialogo-acoes">
        <button value="cancelar" class="botao">Cancelar</button>
        <button value="ok" id="dialogo-ok" class="botao primario"></button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status" hidden></div>

  <section id="reprodutor" class="reprodutor" aria-label="Reprodutor de áudio" hidden>
    <div class="reprodutor-faixa">
      <div class="reprodutor-capa" aria-hidden="true"><svg class="icone"><use href="#i-catalogo"/></svg></div>
      <div class="reprodutor-info">
        <strong data-player="titulo"></strong>
        <span data-player="subtitulo"></span>
        <span data-player="estado" class="somente-leitor" role="status"></span>
      </div>
    </div>
    <div class="reprodutor-centro">
      <div class="reprodutor-controles">
        <button data-player="anterior" class="reprodutor-botao" type="button" aria-label="Áudio anterior" disabled><svg class="icone" aria-hidden="true"><use href="#i-anterior"/></svg></button>
        <button data-player="play" class="reprodutor-botao reprodutor-play" type="button" aria-label="Reproduzir áudio"><svg class="icone" aria-hidden="true"><use data-player="icone" href="#i-play"/></svg></button>
        <button data-player="proximo" class="reprodutor-botao" type="button" aria-label="Próximo áudio" disabled><svg class="icone" aria-hidden="true"><use href="#i-proximo"/></svg></button>
        <button data-player="loop" class="reprodutor-botao reprodutor-opcao" type="button" aria-label="Repetir áudio atual em loop" aria-pressed="false" title="Ativar loop do áudio atual"><svg class="icone" aria-hidden="true"><use href="#i-loop"/></svg></button>
        <button data-player="automatico" class="reprodutor-botao reprodutor-opcao" type="button" aria-label="Próximo áudio automático" aria-pressed="true" title="Desativar próximo áudio automático"><svg class="icone" aria-hidden="true"><use href="#i-fila-auto"/></svg></button>
      </div>
      <div class="reprodutor-tempo">
        <span data-player="decorrido">0:00</span>
        <input data-player="posicao" class="reprodutor-range" type="range" min="0" max="1" step="0.1" value="0" aria-label="Posição da reprodução" disabled>
        <span data-player="duracao">--:--</span>
      </div>
    </div>
    <div class="reprodutor-volume">
      <button data-player="mudo" class="reprodutor-botao" type="button" aria-label="Silenciar áudio"><svg class="icone" aria-hidden="true"><use data-player="volumeIcone" href="#i-volume"/></svg></button>
      <input data-player="volume" class="reprodutor-range" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
    </div>
  </section>

  <script src="reprodutor.js"></script>
  <script src="app.js"></script>
</body>
</html>
