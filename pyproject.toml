[project]
name = "dublandio"
version = "0.1.0"
description = "Transforma capítulos de livros em áudio dublado, com uma voz por personagem."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "gradio-client>=2.7.2",
    "anthropic>=2.8.0",
]

[project.scripts]
dublandio = "dublandio.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dublandio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
